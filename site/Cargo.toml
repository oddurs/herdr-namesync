[package]
name = "namesync-site"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
maud = "0.27.0"
notify = "8.2.0"
pulldown-cmark = "0.13.4"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# No unsafe anywhere: this renders documents and serves them on localhost, and
# there is nothing here that could need it.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# The binary runs twice in CI and once per deploy, so it is worth optimising
# and worth being small.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
